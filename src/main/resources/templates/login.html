<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Application Sécurisée</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <h2>Veuillez vous identifier</h2>

        <!-- Message d'erreur si identifiants incorrects -->
        <div th:if="${param.error}" class="alert alert-danger">
            Identifiant ou mot de passe invalide.
        </div>

        <!-- Message lors d'une déconnexion réussie -->
        <div th:if="${param.logout}" class="alert alert-success">
            Vous avez été déconnecté avec succès.
        </div>

        <!-- Formulaire de login Spring Security -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Nom d'utilisateur :</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre nom d'utilisateur" required autofocus />
            </div>

            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required />
            </div>

            <div class="form-group">
                <button type="submit" class="btn">Se connecter</button>
            </div>
        </form>

        <a th:href="@{/}" class="btn btn-secondary">Retour à l'accueil</a>

        <div class="credentials-box">
            <strong>Comptes disponibles en mémoire :</strong><br>
            • <code>user</code> / <code>1111</code> (Role: USER)<br>
            • <code>admin</code> / <code>1234</code> (Role: ADMIN, USER)
        </div>
    </div>
</body>
</html>
